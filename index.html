<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#14151A">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Tính Tiền Ship</title>
<style>
  :root{
    --bg:#14151A;
    --paper:#FBF8F1;
    --ink:#2B2B2B;
    --ink-soft:#6b6558;
    --line:#DDD6C4;
    --stamp:#C0392B;
    --ok:#1F8A5F;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:14px 10px 40px;
  }
  .ticket{
    max-width:460px;
    margin:0 auto;
    background:var(--paper);
    border-radius:14px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .head{
    padding:20px 20px 16px;
    text-align:center;
    border-bottom:1.5px dashed var(--line);
  }
  .head h1{
    font-size:19px;
    letter-spacing:.3px;
    color:var(--ink);
    font-weight:700;
  }
  .head .sub{
    font-family:"Courier New",monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .date-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px 20px;
    border-bottom:1.5px dashed var(--line);
  }
  .date-row label{font-size:13px;color:var(--ink-soft);font-family:"Courier New",monospace;}
  .date-row input[type=date]{
    border:none;
    background:transparent;
    font-family:"Courier New",monospace;
    font-size:14px;
    color:var(--ink);
    font-weight:700;
  }
  .entry{
    padding:16px 20px;
    border-bottom:1.5px dashed var(--line);
  }
  .entry input{
    width:100%;
    padding:13px 14px;
    font-size:16px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    font-family:"Courier New",monospace;
  }
  .entry input:focus{outline:none;border-color:var(--ink);}
  .entry .hint{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:6px;
    font-family:"Courier New",monospace;
  }
  .entry button{
    width:100%;
    margin-top:10px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--ink);
    color:var(--paper);
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .entry button:active{background:#000;}

  .lines{padding:4px 0;}
  .row{
    display:grid;
    grid-template-columns:34px 1fr 60px 30px;
    align-items:center;
    gap:6px;
    padding:11px 20px;
    border-bottom:1px dashed var(--line);
    font-family:"Courier New",monospace;
    font-size:13.5px;
  }
  .row .d{color:var(--ink-soft);font-size:12px;}
  .row .name{
    text-align:left;
    line-height:1.3;
    word-break:break-word;
  }
  .row .sum{
    text-align:right;
    font-weight:700;
    color:var(--ok);
  }
  .row .breakdown{
    grid-column:2/4;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .row .del{
    justify-self:end;
    background:none;
    border:none;
    color:var(--stamp);
    font-size:18px;
    line-height:1;
    padding:6px;
    cursor:pointer;
  }
  .empty{
    padding:32px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-family:"Courier New",monospace;
    font-size:13px;
  }

  .total{
    padding:18px 20px 20px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-top:2px solid var(--ink);
  }
  .total .label{font-size:14px;font-weight:700;letter-spacing:.2px;}
  .total .amount{
    font-family:"Courier New",monospace;
    font-size:22px;
    font-weight:700;
    color:var(--stamp);
  }

  .reset{
    text-align:center;
    margin-top:14px;
    font-size:12px;
    color:#726a5a;
    text-decoration:underline;
    cursor:pointer;
  }
</style>
</head>
<body>
  <div class="ticket">
    <div class="head">
      <h1>💰 Tính Tiền Ship</h1>
      <div class="sub">sổ ghi ship hằng ngày</div>
    </div>

    <div class="date-row">
      <label for="dateInput">Ngày</label>
      <input type="date" id="dateInput">
    </div>

    <div class="entry">
      <input type="text" id="quickInput" placeholder="tên 100 15 0">
      <div class="hint">tên · ship · chèn · chênh (chèn/chênh có thể bỏ trống)</div>
      <button onclick="addRow()">➕ Thêm dòng</button>
    </div>

    <div class="lines" id="tableBody"></div>

    <div class="total">
      <span class="label">Tổng tất cả</span>
      <span class="amount" id="grandTotal">0đ</span>
    </div>
  </div>

  <div class="reset" onclick="clearAll()">Xóa hết dữ liệu</div>

<script>
  const STORAGE_KEY = 'tien_ship_data_v5';
  const DATE_KEY = 'tien_ship_date_v5';

  function initDate(){
    const today = new Date().toISOString().split('T')[0];
    const savedDate = localStorage.getItem(DATE_KEY);
    document.getElementById('dateInput').value = savedDate || today;
    document.getElementById('dateInput').addEventListener('change', () => {
      localStorage.setItem(DATE_KEY, document.getElementById('dateInput').value);
    });
  }

  function formatDateDisplay(dateStr){
    if(!dateStr) return '';
    const [y,m,d] = dateStr.split('-');
    return `${d}/${m}`;
  }

  function parseInput(input){
    const parts = input.trim().split(/\s+/);
    if(parts.length === 0) return null;
    let numStart = parts.length;
    for(let i = parts.length - 1; i >= 0; i--){
      if(!isNaN(parseFloat(parts[i])) && isFinite(parts[i])) numStart = i;
      else break;
    }
    const name = parts.slice(0, numStart).join(' ') || 'Khách';
    const nums = parts.slice(numStart).map(n => parseFloat(n) || 0);
    const [ship=0, chen=0, chenh=0] = nums;
    return { name, ship, chen, chenh };
  }

  function addRow(){
    const input = document.getElementById('quickInput').value;
    const dateVal = document.getElementById('dateInput').value;
    if(!input.trim()) return alert('Nhập dữ liệu đã!');
    if(!dateVal) return alert('Chọn ngày đã!');

    const data = parseInput(input);
    if(!data) return;
    const total = data.ship + data.chen + data.chenh;

    const allData = getAllData();
    allData.push({ date: dateVal, name: data.name, ship: data.ship, chen: data.chen, chenh: data.chenh, total });
    allData.sort((a,b) => new Date(a.date) - new Date(b.date));

    saveAllData(allData);
    renderTable(allData);
    document.getElementById('quickInput').value = '';
  }

  function getAllData(){
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : [];
  }

  function saveAllData(data){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function renderTable(data){
    const body = document.getElementById('tableBody');
    if(data.length === 0){
      body.innerHTML = '<div class="empty">Chưa có dòng nào — nhập ở trên để bắt đầu</div>';
      updateGrandTotal(data);
      return;
    }

    body.innerHTML = data.map((item, index) => `
      <div class="row">
        <span class="d">${formatDateDisplay(item.date)}</span>
        <span class="name">${escapeHtml(item.name)}</span>
        <span class="sum">${item.total}đ</span>
        <button class="del" data-index="${index}">✕</button>
        <span class="breakdown">ship ${item.ship} · chèn ${item.chen} · chênh ${item.chenh}</span>
      </div>
    `).join('');

    document.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', () => deleteRow(parseInt(btn.dataset.index)));
    });

    updateGrandTotal(data);
  }

  function deleteRow(index){
    const allData = getAllData();
    allData.splice(index, 1);
    saveAllData(allData);
    renderTable(allData);
  }

  function clearAll(){
    if(confirm('Xóa hết toàn bộ dữ liệu?')){
      localStorage.removeItem(STORAGE_KEY);
      renderTable([]);
    }
  }

  function updateGrandTotal(data){
    const sum = data.reduce((t, item) => t + item.total, 0);
    document.getElementById('grandTotal').textContent = sum + 'đ';
  }

  function escapeHtml(text){
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  document.getElementById('quickInput').addEventListener('keypress', e => {
    if(e.key === 'Enter') addRow();
  });

  initDate();
  renderTable(getAllData());

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</body>
</html>
